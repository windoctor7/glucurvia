name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  TZ: UTC
jobs:
  backend:
    # Cuando se acaben los minutos gratuitos: runs-on: [self-hosted, macOS] en el iMac (plan, apéndice C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # spotless:check y el test de deriva del OpenAPI van dentro de verify
      - run: ./mvnw -B -q verify
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gen
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
  eval-llm:
    # Manual: usa el modelo real con ANTHROPIC_API_KEY del secreto. Nunca en PRs.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "set de evaluación de extracción y seguridad (fase 2)"
