# Versión de la API de Docker que pide el cliente Java de Testcontainers (docker-java la lee del classpath).
# Docker Engine 29+ (Docker Desktop de finales de 2025 en adelante) exige como mínimo la 1.44 y responde 400
# a versiones más antiguas: Testcontainers falla con "Could not find a valid Docker environment".
# 1.44 la aceptan también los motores anteriores (Docker 25+). Ver testcontainers-java #11212.
api.version=1.44
