# Logs de las pruebas de core-testing (slf4j-simple): silencioso salvo Testcontainers, que explica qué
# estrategias de conexión a Docker probó y por qué fallaron.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.org.testcontainers=info
org.slf4j.simpleLogger.showDateTime=false
